<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevOps Projects</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div class="wrap">
<header class="site"><h1>My DevOps Projects</h1>
<p class="lead">Hands-on work with containers, clusters, pipelines and cloud. Select a project to see its steps, commands, screenshots and code.</p></header>
<div class="filters" id="filters" role="group" aria-label="Filter by tool"></div>
<main class="grid" id="grid"></main>
<footer>Built with HTML, CSS and JavaScript, hosted on GitHub Pages.</footer>
</div>
<script src="projects.js"></script>
<script>
const grid=document.getElementById('grid'),fl=document.getElementById('filters');
const tools=['All',...new Set(PROJECTS.map(p=>p.tool))];
function show(t){
 grid.innerHTML='';
 PROJECTS.filter(p=>t==='All'||p.tool===t).forEach(p=>{
  const a=document.createElement('a');a.className='card';a.href='project.html?id='+encodeURIComponent(p.id);
  a.innerHTML=`<span class="tool"></span><h2></h2><p></p><span class="tags"></span>`;
  a.children[0].textContent=p.tool;a.children[1].textContent=p.title;a.children[2].textContent=p.summary;a.children[3].textContent=p.stack.join(', ');
  grid.appendChild(a);});
 [...fl.children].forEach(b=>b.setAttribute('aria-pressed',b.textContent===t));
}
tools.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(t);fl.appendChild(b);});
show('All');
</script></body></html>
